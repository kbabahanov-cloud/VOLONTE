# "kareler" dalında çalışır: Selin istekler/<kod>.json yazınca videodan en net kareler seçilir,
# kareler/<kod>/ altına kaydedilir ve Selin'e haber verilir (onay Telegram'da). Ücretsiz (açık depo).
name: kare
on:
  push:
    branches: [kareler]
    paths: ["istekler/*.json"]
permissions:
  contents: write
concurrency:
  group: kare
  cancel-in-progress: false
jobs:
  kare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kareler
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy
      - name: Kareleri seç
        run: python kare.py isle
      - name: Kaydet
        id: kayit
        run: |
          git config user.name "Selin (VOLONTE)"
          git config user.email "selin@users.noreply.github.com"
          git add -A . && git reset -q sonuc.json
          git commit -m "Selin: videodan kare adayları" || true
          git pull --rebase -q origin kareler
          git push -q origin HEAD:kareler
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Selin'e haber ver
        run: python kare.py bildir ${{ steps.kayit.outputs.sha }}
