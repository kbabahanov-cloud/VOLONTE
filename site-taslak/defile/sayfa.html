<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>VOLONTE — Defile</title>
<meta name="description" content="VOLONTE defile sahnesi — önizleme">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --siyah: #050505; --altin: #d4af5a; --altin-acik: #f1dc9c; --krem: #f3ead8;
    --figur-h: min(66vh, 760px); /* en öndeki mankenin boyu */
    --zemin: 21vh;               /* podyum yüksekliği (ekranın altı) */
    --ufuk: 40%;                 /* kaçış noktası (perspektif merkezi) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--siyah); color: var(--krem); font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif; overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none; }

  /* ---------- Işık ve sis ---------- */
  .isik { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(70vw 60vh at 50% var(--ufuk), rgba(212,175,90,.14) 0%, rgba(212,175,90,.04) 38%, transparent 65%),
      linear-gradient(180deg, #000 0%, #070706 60%, #0c0b08 100%); }
  .isik::after { content: ""; position: absolute; left: 50%; top: -14vh; width: 90vw; height: 90vh; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(255,240,200,.10), transparent 70%); animation: nefes 9s ease-in-out infinite; }
  .gezen { position: fixed; inset: 0; pointer-events: none; z-index: 3; mix-blend-mode: screen; opacity: .55;
    background: radial-gradient(28vw 70vh at 20% 45%, rgba(241,220,156,.16), transparent 70%);
    animation: gez 16s ease-in-out infinite alternate; }
  @keyframes gez { from { transform: translateX(0); } to { transform: translateX(60vw); } }
  @keyframes nefes { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  .sis { position: fixed; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; z-index: 2;
    background: radial-gradient(80vw 46vh at 50% var(--ufuk), rgba(14,13,10,.85) 0%, rgba(10,9,7,.45) 45%, transparent 75%); }

  /* ---------- Üst yazı / alt düğme ---------- */
  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; z-index: 7; text-align: center; pointer-events: none; }
  .marka { font-size: clamp(26px, 5vw, 46px); letter-spacing: .42em; padding-left: .42em; color: var(--altin); text-shadow: 0 0 24px rgba(212,175,90,.35); }
  .slogan { margin-top: 2px; font-size: clamp(15px, 2.3vw, 21px); letter-spacing: .14em; font-style: italic; font-weight: 300; color: rgba(243,234,216,.78); }
  footer { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 7; text-align: center; pointer-events: none; }
  .kesfet { pointer-events: auto; display: inline-block; padding: 12px 28px; border: 1px solid var(--altin); color: var(--altin-acik); text-decoration: none;
    font-size: clamp(15px, 2.4vw, 19px); letter-spacing: .26em; padding-left: calc(28px + .26em); background: rgba(5,5,5,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: background .3s, color .3s; }
  .kesfet:hover, .kesfet:focus-visible { background: var(--altin); color: #1a1407; }
  .ipucu { margin-top: 9px; font-size: 13px; letter-spacing: .12em; color: rgba(243,234,216,.42); font-style: italic; transition: opacity .6s; }

  /* ---------- Podyum (ıslak zemin) ---------- */
  .podyum { position: fixed; left: 0; right: 0; bottom: 0; height: var(--zemin); z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(212,175,90,.20) 0%, rgba(212,175,90,.04) 12%, transparent 60%), linear-gradient(180deg, #0a0906, #000); }
  .podyum::before { content: ""; position: absolute; left: 6%; right: 6%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(241,220,156,.7), transparent); }
  .podyum::after { content: ""; position: absolute; left: -30%; top: 0; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(241,220,156,.07), transparent); animation: parilti 12s linear infinite; }
  @keyframes parilti { from { transform: translateX(0); } to { transform: translateX(270%); } }

  /* ---------- 3B sahne ---------- */
  .sahne { position: fixed; inset: 0; z-index: 2; perspective: 1000px; perspective-origin: 50% var(--ufuk); }
  .dunya { position: absolute; left: 0; right: 0; bottom: var(--zemin); height: 0; transform-style: preserve-3d; will-change: transform;
    transition: transform 1.1s cubic-bezier(.22,.8,.26,1); }
  .dunya.hizli { transition: none; }
  .f { position: absolute; left: 50%; bottom: 0; height: var(--figur-h); transform-style: preserve-3d; backface-visibility: hidden; cursor: pointer; outline: none; }
  .f .gov { position: relative; height: 100%; animation: sallan 7s ease-in-out infinite; }
  .f:nth-child(3n) .gov { animation-duration: 8.6s; animation-delay: -2.1s; }
  .f:nth-child(4n) .gov { animation-duration: 9.7s; animation-delay: -4.3s; }
  .f:nth-child(5n) .gov { animation-duration: 6.4s; animation-delay: -1.2s; }
  @keyframes sallan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-.6%); } }
  .f img { height: 100%; width: auto; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 14px 18px rgba(0,0,0,.55)); }
  .f .yan { position: absolute; left: 0; right: 0; top: 100%; height: 40%; overflow: hidden; pointer-events: none; opacity: .5; transform: scaleY(-1) translateY(-100%); transform-origin: top; }
  .f .yan img { height: calc(100% / .4); filter: blur(3px) brightness(.85); }
  .f .yan::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,5,1) 0%, rgba(5,5,5,.5) 40%, rgba(5,5,5,.05) 100%); }
  /* derinlik sınıfları (kameraya olan uzaklığa göre JS verir) */
  .f[data-u="0"] { filter: blur(0) brightness(1.05); opacity: 1; }
  .f[data-u="1"] { filter: blur(.8px) brightness(.78); opacity: .97; }
  .f[data-u="2"] { filter: blur(1.8px) brightness(.55); opacity: .9; }
  .f[data-u="3"] { filter: blur(3px) brightness(.38); opacity: .78; }
  .f[data-u="4"] { filter: blur(4px) brightness(.26); opacity: .6; }
  .f[data-u="5"] { opacity: 0; pointer-events: none; filter: blur(6px); }
  .f { transition: opacity .7s ease, filter .7s ease; }
  .f.odak .gov { animation: none; }

  /* ---------- Kod rozeti ---------- */
  .etiket { position: fixed; left: 50%; bottom: calc(var(--zemin) + 10px); transform: translate(-50%, 10px); z-index: 8; opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; text-align: center; }
  .etiket.acik { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .etiket .kod { display: inline-block; padding: 9px 20px; border: 1px solid rgba(212,175,90,.65); border-radius: 999px; background: rgba(5,5,5,.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: clamp(16px, 2.6vw, 20px); letter-spacing: .22em; color: var(--altin-acik); }
  .etiket a, .etiket button { display: inline-block; margin: 8px 10px 0; color: rgba(243,234,216,.8); font: inherit; font-size: 15px; letter-spacing: .1em; text-decoration: none; background: none; border: 0; border-bottom: 1px solid rgba(243,234,216,.3); padding: 0 0 1px; cursor: pointer; }

  .perde { position: fixed; inset: 0; z-index: 9; background: #000; display: grid; place-items: center; transition: opacity 1.2s ease; }
  .perde.git { opacity: 0; pointer-events: none; }
  .perde span { color: var(--altin); letter-spacing: .5em; padding-left: .5em; font-size: 28px; animation: nefes 2s ease-in-out infinite; }

  @media (max-width: 720px) {
    :root { --figur-h: min(56vh, 600px); --zemin: 22vh; --ufuk: 38%; }
    .sahne { perspective: 820px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .f .gov, .isik::after, .podyum::after, .gezen, .perde span { animation: none !important; }
    .dunya { transition-duration: .01s; }
  }
</style>
</head>
<body>
  <div class="isik" aria-hidden="true"></div>
  <header><div class="marka">VOLONTE</div><div class="slogan">Live your life</div></header>

  <div class="sahne" id="sahne" aria-label="Defile sahnesi">
    <div class="dunya" id="dunya"></div>
  </div>
  <div class="sis" aria-hidden="true"></div>
  <div class="gezen" aria-hidden="true"></div>
  <div class="podyum" aria-hidden="true"></div>

  <div class="etiket" id="etiket">
    <div class="kod" id="kod"></div>
    <div><a id="modelLink" href="#" target="_blank" rel="noopener">Modeli gör</a><button type="button" id="geri">Sahneye dön</button></div>
  </div>

  <footer>
    <a class="kesfet" href="https://www.wearvolonte.com" target="_blank" rel="noopener">Koleksiyonu keşfet</a>
    <div class="ipucu" id="ipucu">Yukarı kaydırın: sahneye girin · bir mankene dokunun</div>
  </footer>
  <div class="perde" id="perde"><span>VOLONTE</span></div>

<script>
(function () {
  // Mankenler: sitedeki gerçek fotoğraflarımız (arka planı ayrılmış). Derlemede yerleştirilir: [{kod, dosya, en}] (en = genişlik/boy).
  const MANKENLER = /*MANKENLER*/[];
  const SITE = "https://www.wearvolonte.com";
  const dunya = document.getElementById("dunya"), sahne = document.getElementById("sahne");
  const etiket = document.getElementById("etiket"), kodEl = document.getElementById("kod"), link = document.getElementById("modelLink");
  const telefon = matchMedia("(max-width: 720px)").matches;

  // ---- Yerleşim: sıralar arkaya doğru kalabalıklaşır; her sıra bir öncekinden daha derin ve daha geniş ----
  const SIRA_DERIN = 560;                                       // sıralar arası derinlik (px, 3B)
  const SIRALAR = telefon ? [2, 3, 4, 5, 6, 6] : [2, 3, 4, 5, 6, 7, 7];  // sıra başına manken
  const fig = [];
  let say = 0;
  for (const [r, n] of SIRALAR.entries()) {
    const z = r * SIRA_DERIN;
    const genis = r === 0 ? (telefon ? 250 : 470) : (telefon ? 150 : 210) * (1 + r * 0.38); // ön sıra ferah; derinde daha geniş
    for (let i = 0; i < n; i++) {
      const m = MANKENLER[say % MANKENLER.length]; say++;            // az manken varsa tekrar (farklı derinlikte)
      const t = n === 1 ? 0 : i / (n - 1) - 0.5;
      const sap = ((say * 37) % 23 - 11) * (6 + r * 2);               // hafif düzensizlik
      fig.push({ m, x: t * genis * (n - 1) + sap, z: z + ((say * 53) % 7 - 3) * 25, r });
    }
  }
  const zMax = (SIRALAR.length - 1) * SIRA_DERIN;

  // ---- Öğeler ----
  for (const [i, f] of fig.entries()) {
    const el = document.createElement("div");
    el.className = "f"; el.dataset.i = i; el.setAttribute("role", "button"); el.setAttribute("tabindex", "0"); el.setAttribute("aria-label", `Model ${f.m.kod}`);
    const kucuk = f.r >= 2; // arka sıralar küçük görsel (hız)
    const src = `/g/${f.m.dosya}${kucuk ? "-k" : ""}.webp`;
    el.innerHTML = `<div class="gov"><img src="${src}" alt="VOLONTE model ${f.m.kod}" decoding="async" loading="${f.r <= 1 ? "eager" : "lazy"}" fetchpriority="${f.r === 0 ? "high" : "auto"}">${f.r <= 1 ? `<div class="yan" aria-hidden="true"><img src="${src}" alt=""></div>` : ""}</div>`;
    el.style.transform = `translate3d(calc(-50% + ${f.x}px), 0, ${-f.z}px)`;
    el.style.zIndex = String(1000 - Math.round(f.z / 10));
    el.addEventListener("click", (e) => { e.stopPropagation(); odakla(i); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); odakla(i); } });
    f.el = el; dunya.appendChild(el);
  }

  // ---- Kamera ----
  let kam = 0, kamX = 0, odak = -1, acik = false;
  const sinir = (v, a, b) => Math.max(a, Math.min(b, v));
  function uygula(hizli) {
    dunya.classList.toggle("hizli", Boolean(hizli));
    dunya.style.transform = `translate3d(${-kamX}px, 0, ${kam}px)`;
    for (const f of fig) {
      const d = f.z - kam; // kameraya göre derinlik
      f.el.dataset.u = d < -70 ? "5" : d < 320 ? "0" : d < 900 ? "1" : d < 1550 ? "2" : d < 2300 ? "3" : "4"; // 5: kameranın gerisinde → görünmez
    }
  }
  function odakla(i) {
    const f = fig[i];
    if (odak === i && acik) { acik = false; etiket.classList.remove("acik"); return; }
    if (odak >= 0) fig[odak].el.classList.remove("odak");
    odak = i; f.el.classList.add("odak");
    kam = sinir(f.z - 60, 0, zMax + 400); kamX = f.x;        // manken öne gelir, diğerleri geri çekilir
    uygula(false);
    kodEl.textContent = `MODEL ${f.m.kod}`; link.href = `${SITE}/#model/${f.m.kod}`;
    acik = true; etiket.classList.add("acik");
    document.getElementById("ipucu").style.opacity = "0";
  }
  document.getElementById("geri").addEventListener("click", () => { acik = false; etiket.classList.remove("acik"); if (odak >= 0) fig[odak].el.classList.remove("odak"); odak = -1; kam = 0; kamX = 0; uygula(false); });
  sahne.addEventListener("click", () => { if (acik) { acik = false; etiket.classList.remove("acik"); } });

  // ---- Hareket: tekerlek, parmak (dikey = içeri/dışarı, yatay = sağa/sola), iki parmak (büyütme = içeri) ----
  const ilerle = (dz, dx, hizli) => { kam = sinir(kam + dz, 0, zMax + 400); kamX = sinir(kamX + (dx || 0), -900, 900); uygula(hizli); document.getElementById("ipucu").style.opacity = "0"; };
  addEventListener("wheel", (e) => { e.preventDefault(); ilerle(e.deltaY * 1.6, e.deltaX * 0.8, true); }, { passive: false });
  let p1 = null, p2 = null, uzak0 = 0;
  addEventListener("touchstart", (e) => { if (e.touches.length === 1) p1 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; if (e.touches.length === 2) { uzak0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); p2 = true; } }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && p2) { const u = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); ilerle((u - uzak0) * 4, 0, true); uzak0 = u; return; }
    if (e.touches.length === 1 && p1) { const t = e.touches[0]; ilerle((p1.y - t.y) * 3.2, (p1.x - t.x) * 1.1, true); p1 = { x: t.x, y: t.y }; }
  }, { passive: true });
  addEventListener("touchend", () => { p1 = null; p2 = null; }, { passive: true });
  addEventListener("keydown", (e) => { if (e.key === "ArrowUp") ilerle(140, 0); if (e.key === "ArrowDown") ilerle(-140, 0); if (e.key === "ArrowLeft") ilerle(0, -80); if (e.key === "ArrowRight") ilerle(0, 80); });
  addEventListener("resize", () => uygula(true));

  // ---- Perde: ön iki sıra gelince kalkar (en geç 6 sn) ----
  const onler = fig.filter((f) => f.r <= 1).map((f) => f.el.querySelector("img"));
  const kalk = () => { uygula(true); document.getElementById("perde").classList.add("git"); };
  Promise.all(onler.map((im) => im.complete ? Promise.resolve() : new Promise((r) => { im.onload = r; im.onerror = r; }))).then(kalk);
  setTimeout(kalk, 6000);
  uygula(true);
})();
</script>
</body>
</html>
